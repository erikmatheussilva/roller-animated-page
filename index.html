<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Snitap</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <header class="container padding-y padding-x-lg">
      <nav>
        <a id="spinning-logo" href="">
          <img src="assets/icons/logo.svg" alt="Snitap" />
        </a>
        <a id="spinning-bag" href="">
          <img src="assets/icons/bag.svg" alt="Your Bag" />
          <span>1</span>
        </a>
      </nav>
    </header>
    <section id="hero" class="container padding-y">
      <div>
        <h1>
          Snitap, sua vida mais
          <div>
            <span>radical</span>
            <span>divertida</span>
            <span>saudável</span>
            <span>radical</span>
          </div>
        </h1>
        <div class="hero-buttons">
          <a id="buyNow" href="">
            <img src="assets/icons/bag.svg" alt="Shopping Bag" />
            Comprar Agora
          </a>
  
          <a id="preview" href="">
            <span>
              <img src="assets/icons/play.svg" alt="Play">
            </span>
            Veja em ação
          </a>
        </div>
      </div>
      <div class="hero-image slide-in-right">
        <div class="content">
          <img src="assets/hero/ellipse.svg" alt="Ellipse" />
          <img src="assets/hero/patins-image.png" alt="Rollers" />
          <img src="assets/hero/stars-1.svg" alt="Star" />
          <img src="assets/hero/stars-2.svg" alt="Star" />
        </div>
      </div>
    </section>
  </body>
</html>
